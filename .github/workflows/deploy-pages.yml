name: Deploy snowglobe and developer preview

on:
  push:
    branches: [main]
    paths:
      - '웹체험_3D/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check out developer experience
        uses: actions/checkout@v6
        with:
          ref: codex/experiment
          path: _experiment
      - uses: actions/configure-pages@v5
      - name: Check public and developer experiences
        run: |
          for source in 웹체험_3D _experiment/웹체험_3D; do
            node --check "$source/app.js"
            node --check "$source/scene3d.js"
            for check in liquid-snow snow-filling snow-surface carol hand-tracking tracking-client motion audience snow-wish; do
              node "$source/verification/check-$check.mjs"
            done
          done
          node _experiment/웹체험_3D/verification/check-snow-entry.mjs
          node _experiment/웹체험_3D/verification/check-camera-distance-motion.mjs
      - name: Prepare public and developer URLs
        run: |
          mkdir -p _site/verification
          cp 웹체험_3D/*.html 웹체험_3D/*.css 웹체험_3D/*.js 웹체험_3D/*.mjs _site/
          cp -R 웹체험_3D/assets 웹체험_3D/vendor _site/
          cp 웹체험_3D/verification/liquid-preview.html _site/verification/
          mkdir -p _site/experiment/verification
          cp _experiment/웹체험_3D/*.html _experiment/웹체험_3D/*.css _experiment/웹체험_3D/*.js _experiment/웹체험_3D/*.mjs _site/experiment/
          cp -R _experiment/웹체험_3D/assets _experiment/웹체험_3D/vendor _site/experiment/
          cp _experiment/웹체험_3D/verification/liquid-preview.html _site/experiment/verification/
          git rev-parse HEAD > _site/version.txt
          git -C _experiment rev-parse HEAD > _site/experiment/version.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
