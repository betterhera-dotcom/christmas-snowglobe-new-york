name: Deploy snowglobe to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '웹체험_3D/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check liquid simulation
        run: |
          node --check 웹체험_3D/app.js
          node --check 웹체험_3D/scene3d.js
          node 웹체험_3D/verification/check-liquid-snow.mjs
          node 웹체험_3D/verification/check-snow-filling.mjs
          node 웹체험_3D/verification/check-snow-surface.mjs
          node 웹체험_3D/verification/check-motion.mjs
          node 웹체험_3D/verification/check-audience.mjs
          node 웹체험_3D/verification/check-snow-wish.mjs
      - name: Prepare static experience
        run: |
          mkdir -p _site/verification
          cp 웹체험_3D/*.html 웹체험_3D/*.css 웹체험_3D/*.js 웹체험_3D/*.mjs _site/
          cp -R 웹체험_3D/assets 웹체험_3D/vendor _site/
          cp 웹체험_3D/verification/liquid-preview.html _site/verification/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
