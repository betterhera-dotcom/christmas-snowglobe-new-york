<!doctype html><meta charset="utf-8"><base href="../../"><style>body{overflow:hidden;margin:0;background:#17251a}#shop,#scene{position:absolute;inset:0}#shop{background:url(assets/redraw-v4/shop.png) center/cover}label{position:absolute;bottom:20px;left:20px;color:white;background:#0009;padding:12px}input{width:400px}</style><div id="shop"></div><div id="scene"></div><label>전환 검증 <input aria-label="전환" type="range" min="0" max="1" step=".01" value="0"><select aria-label="시야"><option value=".5,.5">정면</option><option value="0,0">왼쪽 위</option><option value="1,1">오른쪽 아래</option></select></label><script type="module">import{createScene}from './art-scene.js';const scene=createScene(document.querySelector('#scene'));const slider=document.querySelector('input');document.querySelector("select").onchange=e=>scene.lookAt(...e.target.value.split(",").map(Number));let last=performance.now();function frame(now){scene.update(Math.min(.05,(now-last)/1000),now/1000,{x:.5,y:.5,energy:.6,keepHeld:true,wristRoll:.25,pitch:.6},Number(slider.value));last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame)</script>
